<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Wildcard Techno Services — Kolkata-based solution integrator and authorized distributor for Unified Communications, network infrastructure, cyber security and enterprise IT across India." />
    <meta property="og:title" content="Wildcard Techno Services" />
    <meta property="og:description" content="Unified Communications & Collaboration, network, security and enterprise IT solutions." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <meta name="color-scheme" content="light dark" />
    <script>
      /* Apply the saved (or system) theme before first paint to avoid a flash */
      (function () {
        try {
          var s = localStorage.getItem('theme');
          var dark = s ? s === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
    <title>Wildcard Techno Services | Unified Communications & Collaboration</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
